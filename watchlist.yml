# 관심 목록. 여기만 고치면 무엇이든 추적할 수 있다.
#
# 각 항목의 `all`은 그룹의 리스트다.
#   - 그룹 "안"의 값들은 OR  (표기 흔들림 흡수: 라흐마니노프 / Rachmaninoff)
#   - 그룹 "끼리"는 AND      (작곡가 AND 작품 둘 다 있어야 매칭)
# 비교 전에 공백을 모두 제거하고 소문자로 바꾸므로
# "협주곡 제2번"과 "협주곡제2번"은 같게 취급된다.

watches:
  # 그룹을 셋(작곡가 / 장르 / 번호)으로 나눈 이유:
  #   작품번호만 우연히 겹치는 오탐이 사라진다. 실제 겪은 예 (후지타 마오 리사이틀):
  #       Scriabin, Piano Sonata No. 4 ... Op. 30
  #       라흐마니노프, 피아노 소나타 제2번 ...
  #   Op.30은 스크랴빈 것이고 라흐마니노프 곡은 소나타다. '협주곡' 조건이 이걸 막는다.
  - name: 라흐마니노프 피아노 협주곡 2번
    window: 70
    all:
      - [라흐마니노프, Rachmaninoff, Rachmaninov, Rakhmaninov]
      - [협주곡, Concerto]
      - [2번, 제2번, "No. 2", "No.2", "Op. 18", "Op.18"]

  - name: 라흐마니노프 피아노 협주곡 3번
    window: 70
    all:
      - [라흐마니노프, Rachmaninoff, Rachmaninov, Rakhmaninov]
      - [협주곡, Concerto]
      - [3번, 제3번, "No. 3", "No.3", "Op. 30", "Op.30"]

  # 번호를 명시하지 않는 공연을 잡기 위한 항목.
  # '라흐마니노프 3개의 피아노 협주곡'(2026-10-02 롯데)이 위 두 항목에 안 걸렸다.
  # 제목에 "2번/3번"이 없고 "3개의"라고만 돼 있었기 때문. 전곡/묶음 공연은
  # 오히려 가장 보고 싶은 공연이므로 별도로 챙긴다.
  - name: 라흐마니노프 협주곡 (전곡·묶음)
    window: 60
    all:
      - [라흐마니노프, Rachmaninoff, Rachmaninov]
      - [협주곡, Concerto]
      - [전곡, 3개의, 세 개의, 전곡 시리즈, "all three", 사이클]

  # --- 예시. 필요 없으면 지우고 원하는 걸 추가하세요 ---
